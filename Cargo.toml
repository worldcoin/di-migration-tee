[workspace]
members = [
    "enclave",
    "host",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
license = "MIT"
homepage = "https://github.com/worldcoin/di-migration-tee"
repository = "https://github.com/worldcoin/di-migration-tee"
publish = false

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
